<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plate Speller Admin v10</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        .login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { text-align: center; }
        .login-box input { display: block; margin: 8px auto; padding: 10px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; width: 280px; }
        .login-box button { margin-top: 8px; background: #7c3aed; color: white; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; cursor: pointer; }
        .login-box button:hover { background: #6d28d9; }
        #loginError { color: #dc2626; margin-top: 8px; font-size: 13px; }
        .tab-bar { display: flex; background: #fff; border-bottom: 2px solid #e5e7eb; padding: 0 16px; flex-shrink: 0; }
        .tab-bar button { padding: 12px 24px; font-size: 14px; font-weight: 600; border: none; background: none; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab-bar button.active { color: #7c3aed; border-bottom-color: #7c3aed; }
        .tab-bar button:hover { color: #374151; }
        .tab-content { flex: 1; }
        .tab-content iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h2>Plate Speller Admin</h2>
            <p style="color:#64748b;margin:8px 0 16px;">Enter admin password</p>
            <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
            <button onclick="doLogin()">Sign In</button>
            <p id="loginError"></p>
        </div>
    </div>

    <div id="mainApp" style="display:none;height:100vh;flex-direction:column;">
        <div class="tab-bar">
            <button class="active" onclick="switchTab('live',this)">Live</button>
            <button onclick="switchTab('dictionary',this)">Dictionary</button>
            <button onclick="switchTab('tools',this)">Platbremetrics</button>
            <button onclick="switchTab('feedback',this)">Feedback</button>
        </div>
        <div class="tab-content" id="tabContent"></div>
    </div>

    <script>
    const v = Date.now();
    const TABS = {
        live: `live.html?auth=live&v=${v}`,
        dictionary: `dictionary.html?auth=dictionary&v=${v}`,
        tools: `tools.html?auth=tools&v=${v}`,
        feedback: `feedback.html?auth=Admin&v=${v}`,
    };

    let activeTab = null;
    let loadedFrames = {};

    function doLogin() {
        const pw = document.getElementById('pw').value.trim();
        if (pw === 'admin') {
            document.getElementById('loginScreen').style.display = 'none';
            const app = document.getElementById('mainApp');
            app.style.display = 'flex';
            switchTab('live', document.querySelector('.tab-bar button'));
        } else {
            document.getElementById('loginError').textContent = 'Wrong password';
            document.getElementById('pw').value = '';
        }
    }

    function switchTab(tab, btn) {
        activeTab = tab;
        document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const container = document.getElementById('tabContent');

        // Hide all iframes
        for (const key in loadedFrames) {
            loadedFrames[key].style.display = 'none';
        }

        // Create iframe if not yet loaded, otherwise show it
        if (!loadedFrames[tab]) {
            const iframe = document.createElement('iframe');
            iframe.src = TABS[tab];
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            container.appendChild(iframe);
            loadedFrames[tab] = iframe;
        } else {
            loadedFrames[tab].style.display = 'block';
        }
    }
    </script>
</body>
</html>

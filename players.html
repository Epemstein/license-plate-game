<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players v1</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 1.3rem; margin-bottom: 16px; }

        /* Search */
        .search-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-row input { flex: 1; padding: 10px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        .search-row input:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.1); }
        .search-results { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 20px; max-height: 300px; overflow-y: auto; }
        .search-result { padding: 10px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f3f4f6; }
        .search-result:hover { background: #f9fafb; }
        .search-result:last-child { border-bottom: none; }
        .sr-name { font-weight: 600; }
        .sr-handle { color: #6b7280; font-size: 13px; }
        .sr-games { color: #9ca3af; font-size: 12px; }

        /* Player card */
        .player-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .player-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .player-name { font-size: 1.2rem; font-weight: 700; }
        .player-handle { color: #6b7280; font-size: 14px; }
        .player-meta { color: #9ca3af; font-size: 12px; margin-top: 4px; }
        .stats-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .mini-stat { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 14px; min-width: 100px; text-align: center; }
        .mini-stat .label { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
        .mini-stat .val { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }

        /* xT breakdown table */
        .xt-breakdown { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .xt-breakdown h3 { font-size: 0.85rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; padding: 14px 16px 8px; }

        /* Runs table */
        .runs-table { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .runs-table h3 { font-size: 0.85rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; padding: 14px 16px 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 8px 12px; border-bottom: 2px solid #e5e7eb; font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 8px 12px; border-bottom: 1px solid #f3f4f6; }
        tr:hover { background: #f9fafb; }
        .positive { color: #16a34a; font-weight: 600; }
        .negative { color: #dc2626; font-weight: 600; }

        .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }

    </style>
</head>
<body>
<div class="container">
    <h1>Players</h1>

    <div class="search-row">
        <input type="text" id="searchInput" placeholder="Search by name or @handle..." autocomplete="off">
    </div>
    <div id="searchResults" class="search-results" style="display:none;"></div>

    <div id="playerView" style="display:none;">
        <div id="playerCard" class="player-card"></div>

        <div id="xtBreakdown" class="xt-breakdown"></div>

        <div id="runsTable" class="runs-table"></div>
    </div>

    <div id="emptyState" class="empty-state">
        Search for a player to view their stats and xT trends.
    </div>
</div>

<script>
const SUPABASE_URL = 'https://ggbvtaegsnlimscmjirf.supabase.co';
const SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnYnZ0YWVnc25saW1zY21qaXJmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NTkxOTA1NSwiZXhwIjoyMDkxNDk1MDU1fQ.b_qDqjP-Nadk_M_kACc5mJB_OR_-Cx80vOgOfLYsDLQ';
const sb = window.supabase.createClient(SUPABASE_URL, SERVICE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false }
});


// Search
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
let searchTimeout = null;

searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    const q = searchInput.value.trim();
    if (q.length < 2) { searchResults.style.display = 'none'; return; }
    searchTimeout = setTimeout(() => doSearch(q), 300);
});

async function doSearch(q) {
    const { data: profiles } = await sb.from('profiles')
        .select('id, display_name, handle')
        .or(`handle.ilike.%${q}%,display_name.ilike.%${q}%`)
        .order('display_name')
        .limit(20);

    if (!profiles || !profiles.length) {
        searchResults.innerHTML = '<div class="search-result"><span class="sr-name">No players found</span></div>';
        searchResults.style.display = 'block';
        return;
    }

    // Get game counts from all modes
    const ids = profiles.map(p => p.id);
    const [dc, hc, pc] = await Promise.all([
        sb.from('daily_runs').select('user_id').in('user_id', ids).not('total_seconds', 'is', null),
        sb.from('h2h_runs').select('user_id').in('user_id', ids).not('total_seconds', 'is', null),
        sb.from('practice_runs').select('user_id').in('user_id', ids).not('total_seconds', 'is', null),
    ]);

    const countMap = {};
    [...(dc.data || []), ...(hc.data || []), ...(pc.data || [])].forEach(r => {
        countMap[r.user_id] = (countMap[r.user_id] || 0) + 1;
    });

    searchResults.innerHTML = profiles.map(p => `
        <div class="search-result" onclick="loadPlayer('${p.id}')">
            <div>
                <span class="sr-name">${p.display_name || 'No name'}</span>
                ${p.handle ? `<span class="sr-handle">@${p.handle}</span>` : ''}
            </div>
            <span class="sr-games">${countMap[p.id] || 0} games</span>
        </div>
    `).join('');
    searchResults.style.display = 'block';
}

async function loadPlayer(userId) {
    searchResults.style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('playerView').style.display = 'block';

    // Fetch profile
    const { data: profile } = await sb.from('profiles')
        .select('id, display_name, handle, is_public, created_at')
        .eq('id', userId)
        .single();

    // Fetch runs from all three tables in parallel
    const [dailyRes, h2hRes, practiceRes] = await Promise.all([
        sb.from('daily_runs')
            .select('date, total_seconds, expected_seconds, completed_at')
            .eq('user_id', userId)
            .not('total_seconds', 'is', null)
            .order('date', { ascending: true }),
        sb.from('h2h_runs')
            .select('created_at, total_seconds, expected_seconds')
            .eq('user_id', userId)
            .not('total_seconds', 'is', null)
            .order('created_at', { ascending: true }),
        sb.from('practice_runs')
            .select('created_at, total_seconds, expected_seconds')
            .eq('user_id', userId)
            .not('total_seconds', 'is', null)
            .order('created_at', { ascending: true })
    ]);

    // Normalize all runs into a common shape
    const allRuns = [];
    (dailyRes.data || []).forEach(r => allRuns.push({
        date: r.date,
        sortKey: r.completed_at || r.date,
        total_seconds: parseFloat(r.total_seconds),
        expected_seconds: r.expected_seconds,
        source: 'Daily'
    }));
    (h2hRes.data || []).forEach(r => allRuns.push({
        date: r.created_at?.slice(0, 10) || '',
        sortKey: r.created_at,
        total_seconds: parseFloat(r.total_seconds),
        expected_seconds: r.expected_seconds,
        source: 'H2H'
    }));
    (practiceRes.data || []).forEach(r => allRuns.push({
        date: r.created_at?.slice(0, 10) || '',
        sortKey: r.created_at,
        total_seconds: parseFloat(r.total_seconds),
        expected_seconds: r.expected_seconds,
        source: 'Practice'
    }));
    allRuns.sort((a, b) => a.sortKey < b.sortKey ? -1 : 1);

    // Fetch overall stats (daily only)
    const { data: statsRows } = await sb.rpc('user_overall_stats', { p_user_id: userId });
    const stats = statsRows?.[0];

    // Fetch streak (daily only)
    const { data: streakDates } = await sb.from('daily_runs')
        .select('date')
        .eq('user_id', userId)
        .not('total_seconds', 'is', null)
        .order('date', { ascending: false })
        .limit(400);

    const streak = computeStreak(streakDates || []);

    // Render player card (use only runs with xT data for stats)
    const xtAllRuns = allRuns.filter(r => r.expected_seconds != null);
    const dailyCount = xtAllRuns.filter(r => r.source === 'Daily').length;
    const h2hCount = xtAllRuns.filter(r => r.source === 'H2H').length;
    const practiceCount = xtAllRuns.filter(r => r.source === 'Practice').length;
    const totalGames = xtAllRuns.length;
    const avgTime = totalGames > 0 ? (xtAllRuns.reduce((s, r) => s + r.total_seconds, 0) / totalGames).toFixed(1) : '--';
    const beatPct = stats?.ratio != null ? (stats.ratio * 100).toFixed(1) + '%' : '--';
    const overallRank = stats?.percentile_rank != null ? 'Top ' + Math.max(1, Math.round(100 - stats.percentile_rank)) + '%' : '--';
    const avgXtDelta = totalGames > 0
        ? (xtAllRuns.reduce((s, r) => s + (r.expected_seconds - r.total_seconds), 0) / totalGames).toFixed(1)
        : '--';
    const signupDate = profile?.created_at ? new Date(profile.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '--';

    document.getElementById('playerCard').innerHTML = `
        <div class="player-header">
            <div>
                <div class="player-name">${profile?.display_name || 'Unknown'}</div>
                ${profile?.handle ? `<div class="player-handle">@${profile.handle}</div>` : ''}
                <div class="player-meta">Joined ${signupDate} · ${profile?.is_public ? 'Public' : 'Private'}</div>
            </div>
        </div>
        <div class="stats-row">
            <div class="mini-stat"><div class="label">Total Runs</div><div class="val">${totalGames}</div></div>
            <div class="mini-stat"><div class="label">Daily</div><div class="val">${dailyCount}</div></div>
            <div class="mini-stat"><div class="label">H2H</div><div class="val">${h2hCount}</div></div>
            <div class="mini-stat"><div class="label">Practice</div><div class="val">${practiceCount}</div></div>
            <div class="mini-stat"><div class="label">Avg Time</div><div class="val">${avgTime}s</div></div>
            <div class="mini-stat"><div class="label">Streak</div><div class="val">${streak}</div></div>
            <div class="mini-stat"><div class="label">Beat</div><div class="val">${beatPct}</div></div>
            <div class="mini-stat"><div class="label">Overall</div><div class="val">${overallRank}</div></div>
            <div class="mini-stat"><div class="label">Avg xT+</div><div class="val ${parseFloat(avgXtDelta) > 0 ? 'positive' : 'negative'}">${avgXtDelta}s</div></div>
        </div>
    `;

    // Filter to only runs with xT data
    const xtRuns = allRuns.filter(r => r.expected_seconds != null);

    // Render xT breakdown by mode
    renderXtBreakdown(xtRuns);

    // Render runs table
    renderRunsTable(xtRuns);
}

function computeStreak(dateRows) {
    const dates = new Set(dateRows.map(r => r.date));
    if (!dates.size) return 0;
    const today = new Date();
    const fmt = d => d.toISOString().slice(0, 10);
    let check = fmt(today);
    if (!dates.has(check)) {
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        check = fmt(yesterday);
        if (!dates.has(check)) return 0;
    }
    let streak = 0;
    let d = new Date(check + 'T00:00:00');
    while (dates.has(fmt(d))) {
        streak++;
        d.setDate(d.getDate() - 1);
    }
    return streak;
}

function renderXtBreakdown(runs) {
    const sourceColors = { Daily: '#7c3aed', H2H: '#f59e0b', Practice: '#3b82f6' };
    const modes = ['Daily', 'H2H', 'Practice'];

    function calcStats(modeRuns) {
        const total = modeRuns.length;
        if (total === 0) return null;
        const avgTime = modeRuns.reduce((s, r) => s + r.total_seconds, 0) / total;
        const withXt = modeRuns.filter(r => r.expected_seconds != null);
        const xtCount = withXt.length;
        const avgXt = xtCount > 0 ? withXt.reduce((s, r) => s + r.expected_seconds, 0) / xtCount : null;
        const medianXt = xtCount > 0 ? (() => {
            const sorted = withXt.map(r => r.expected_seconds).sort((a, b) => a - b);
            const mid = Math.floor(sorted.length / 2);
            return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
        })() : null;
        const avgDelta = xtCount > 0 ? withXt.reduce((s, r) => s + (r.expected_seconds - r.total_seconds), 0) / xtCount : null;
        const beatYes = xtCount > 0 ? withXt.filter(r => r.total_seconds < r.expected_seconds).length : 0;
        const beatNo = xtCount - beatYes;
        return { total, avgTime, avgXt, medianXt, avgDelta, beatYes, beatNo, xtCount };
    }

    let html = '<h3>xT Breakdown by Mode</h3><table><thead>';
    html += '<tr><th rowspan="2">Mode</th><th rowspan="2">Runs</th><th rowspan="2">Avg Time</th><th rowspan="2">Avg xT</th><th rowspan="2">Median xT</th><th rowspan="2">Avg xT+</th><th colspan="2" style="text-align:center;">Beat xT</th></tr>';
    html += '<tr><th>Yes</th><th>No</th></tr>';
    html += '</thead><tbody>';

    modes.forEach(mode => {
        const modeRuns = runs.filter(r => r.source === mode);
        const s = calcStats(modeRuns);
        if (!s) {
            html += `<tr>
                <td><span style="background:${sourceColors[mode]};color:white;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;">${mode}</span></td>
                <td>0</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td>
            </tr>`;
            return;
        }
        const deltaStr = s.avgDelta != null ? (s.avgDelta >= 0 ? '+' : '') + s.avgDelta.toFixed(1) + 's' : '--';
        const deltaClass = s.avgDelta != null ? (s.avgDelta >= 0 ? 'positive' : 'negative') : '';
        html += `<tr>
            <td><span style="background:${sourceColors[mode]};color:white;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;">${mode}</span></td>
            <td><strong>${s.total}</strong></td>
            <td>${s.avgTime.toFixed(1)}s</td>
            <td>${s.avgXt != null ? s.avgXt.toFixed(1) + 's' : '--'}</td>
            <td>${s.medianXt != null ? s.medianXt.toFixed(1) + 's' : '--'}</td>
            <td class="${deltaClass}">${deltaStr}</td>
            <td class="positive">${s.beatYes}</td>
            <td class="negative">${s.beatNo}</td>
        </tr>`;
    });

    // Totals row
    const all = calcStats(runs);
    if (all) {
        const deltaStr = all.avgDelta != null ? (all.avgDelta >= 0 ? '+' : '') + all.avgDelta.toFixed(1) + 's' : '--';
        const deltaClass = all.avgDelta != null ? (all.avgDelta >= 0 ? 'positive' : 'negative') : '';
        html += `<tr style="border-top:2px solid #e5e7eb;font-weight:600;">
            <td>All</td>
            <td><strong>${all.total}</strong></td>
            <td>${all.avgTime.toFixed(1)}s</td>
            <td>${all.avgXt != null ? all.avgXt.toFixed(1) + 's' : '--'}</td>
            <td>${all.medianXt != null ? all.medianXt.toFixed(1) + 's' : '--'}</td>
            <td class="${deltaClass}">${deltaStr}</td>
            <td class="positive">${all.beatYes}</td>
            <td class="negative">${all.beatNo}</td>
        </tr>`;
    }

    html += '</tbody></table>';
    document.getElementById('xtBreakdown').innerHTML = html;
}

function renderRunsTable(runs) {
    const reversed = [...runs].reverse();
    const container = document.getElementById('runsTable');

    const sourceColors = { Daily: '#7c3aed', H2H: '#f59e0b', Practice: '#3b82f6' };

    let html = '<h3>Recent Runs</h3><table><thead><tr>';
    html += '<th>Date</th><th>Mode</th><th>Time</th><th>xT</th><th>Delta</th>';
    html += '</tr></thead><tbody>';

    reversed.slice(0, 80).forEach(r => {
        const time = r.total_seconds.toFixed(1);
        const xt = r.expected_seconds != null ? r.expected_seconds.toFixed(1) : '--';
        let delta = '--';
        let deltaClass = '';
        if (r.expected_seconds != null) {
            const d = r.expected_seconds - r.total_seconds;
            delta = (d >= 0 ? '+' : '') + d.toFixed(1);
            deltaClass = d >= 0 ? 'positive' : 'negative';
        }
        const badgeColor = sourceColors[r.source] || '#6b7280';

        html += `<tr>
            <td>${formatDate(r.date)}</td>
            <td><span style="background:${badgeColor};color:white;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;">${r.source}</span></td>
            <td><strong>${time}s</strong></td>
            <td>${xt}s</td>
            <td class="${deltaClass}">${delta}s</td>
        </tr>`;
    });

    html += '</tbody></table>';
    container.innerHTML = html;
}

function formatDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
</script>
</body>
</html>

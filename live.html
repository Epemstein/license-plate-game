<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; }
        .login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { text-align: center; }
        .login-box input { display: block; margin: 8px auto; padding: 10px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; width: 280px; }
        .login-box button { margin-top: 8px; background: #7c3aed; color: white; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; cursor: pointer; }
        .login-box button:hover { background: #6d28d9; }
        #loginError { color: #dc2626; margin-top: 8px; font-size: 13px; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 1.3rem; }
        .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6b7280; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .dot.off { background: #ef4444; animation: none; }
        .stats-bar { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 18px; min-width: 120px; }
        .stat-card .label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 1.4rem; font-weight: 700; margin-top: 2px; }
        .filters { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
        .filters button { padding: 6px 14px; border-radius: 20px; font-size: 12px; border: 1px solid #ddd; background: #fff; color: #6b7280; cursor: pointer; }
        .filters button.active { background: #7c3aed; color: white; border-color: #7c3aed; }
        .filters button:hover { border-color: #7c3aed; }
        .feed { display: flex; flex-direction: column; gap: 4px; }
        .entry { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; border: 1px solid #e5e7eb; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
        .entry .user { font-size: 0.85rem; color: #374151; font-weight: 600; min-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .entry .plate { font-family: monospace; font-size: 1.1rem; font-weight: 700; color: #111; min-width: 50px; }
        .entry .word { font-size: 0.95rem; min-width: 120px; }
        .entry .word .pl { color: #16a34a; font-weight: 700; }
        .entry .word .nl { color: #111; }
        .entry .word.skipped { color: #dc2626; font-style: italic; }
        .entry .time { font-size: 0.85rem; color: #6b7280; font-variant-numeric: tabular-nums; min-width: 50px; text-align: right; }
        .entry .mode { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; min-width: 55px; text-align: center; }
        .mode-daily { background: #fef3c7; color: #92400e; }
        .mode-practice { background: #f3f4f6; color: #6b7280; }
        .mode-endless { background: #fef3c7; color: #a16207; }
        .mode-h2h { background: #fee2e2; color: #991b1b; }
        .mode-group { background: #dbeafe; color: #1e40af; }
        .entry .ago { font-size: 0.75rem; color: #9ca3af; min-width: 60px; text-align: right; }
        .entry-daily { background: #fefce8; border-color: #f59e0b; }
        .entry-practice { background: #fff; border-color: #d1d5db; }
        .entry-endless { background: #fff; border-color: #f59e0b; }
        .entry-h2h { background: #fff; border-color: #ef4444; }
        .entry-group { background: #fff; border-color: #3b82f6; }
        .empty { text-align: center; padding: 60px 20px; color: #9ca3af; }
        .feed-header { display: flex; align-items: center; gap: 12px; padding: 6px 14px; font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .feed-header .h-user { min-width: 90px; }
        .feed-header .h-plate { min-width: 50px; }
        .feed-header .h-word { min-width: 120px; }
        .feed-header .h-time { min-width: 50px; text-align: right; }
        .feed-header .h-mode { min-width: 55px; text-align: center; }
        .feed-header .h-ago { min-width: 60px; text-align: right; }
        .status-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 18px; display: flex; align-items: center; gap: 8px; }
        .status-card .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; flex-shrink: 0; }
        .status-card .dot.off { background: #ef4444; animation: none; }
        .status-card .status-label { font-size: 0.85rem; font-weight: 600; color: #374151; }
        .bump { display: inline-block; animation: bumpUp 0.5s ease-out; }
        @keyframes bumpUp { 0% { transform: translateY(0); } 30% { transform: translateY(-6px); color: #16a34a; } 100% { transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h2>Live Tracker</h2>
            <p style="color:#64748b;margin:8px 0 16px;">Enter password to continue</p>
            <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
            <button onclick="doLogin()">Sign In</button>
            <p id="loginError"></p>
        </div>
    </div>

    <div id="mainApp" style="display:none;">
        <div class="container">
            <div class="header">
                <h1>Live Tracker</h1>
            </div>
            <div class="stats-bar">
                <div class="status-card">
                    <div class="dot" id="statusDot"></div>
                    <span class="status-label" id="statusText">Connecting...</span>
                </div>
                <div class="stat-card"><div class="label">Today</div><div class="value" id="statToday">0</div></div>
                <div class="stat-card"><div class="label">Last 5 min</div><div class="value" id="statRecent">0</div></div>
            </div>
            <div class="filters">
                <button class="active" data-mode="all" onclick="setFilter('all',this)">All</button>
                <button data-mode="daily" onclick="setFilter('daily',this)">Daily</button>
                <button data-mode="practice" onclick="setFilter('practice',this)">Practice</button>
                <button data-mode="endless" onclick="setFilter('endless',this)">Endless</button>
                <button data-mode="h2h" onclick="setFilter('h2h',this)">H2H</button>
                <button data-mode="group" onclick="setFilter('group',this)">Group</button>
            </div>
            <div class="feed-header">
                <span class="h-user">Player</span>
                <span class="h-plate">Plate</span>
                <span class="h-word">Word</span>
                <span class="h-time">Time</span>
                <span class="h-mode">Mode</span>
                <span class="h-ago"></span>
            </div>
            <div class="feed" id="feed">
                <div class="empty">Waiting for plays...</div>
            </div>
        </div>
    </div>

    <script>
    const SUPABASE_URL = 'https://ggbvtaegsnlimscmjirf.supabase.co';
    const SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnYnZ0YWVnc25saW1zY21qaXJmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NTkxOTA1NSwiZXhwIjoyMDkxNDk1MDU1fQ.b_qDqjP-Nadk_M_kACc5mJB_OR_-Cx80vOgOfLYsDLQ';
    const sb = window.supabase.createClient(SUPABASE_URL, SERVICE_KEY, {
        auth: { persistSession: false, autoRefreshToken: false }
    });

    const MAX_ENTRIES = 200;
    let entries = [];
    let profileCache = {};
    let activeFilter = 'all';
    let sessionStats = { total: 0, skips: 0, times: [] };

    function doLogin() {
        const pw = document.getElementById('pw').value.trim();
        if (pw === 'live') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            init();
        } else {
            document.getElementById('loginError').textContent = 'Wrong password';
            document.getElementById('pw').value = '';
        }
    }

    async function init() {
        // Load recent entries to seed the feed
        await loadRecent();
        // Subscribe to realtime inserts
        subscribe();
        // Update "ago" times every 30s
        setInterval(updateAgos, 30000);
        // Update "last 5 min" stat every 30s
        setInterval(updateRecentStat, 30000);
    }

    async function resolveUser(userId) {
        if (!userId) return null;
        if (profileCache[userId]) return profileCache[userId];
        try {
            const { data } = await sb.from('profiles').select('display_name, handle').eq('id', userId).single();
            const name = data?.display_name || (data?.handle ? '@' + data.handle : null);
            profileCache[userId] = name;
            return name;
        } catch { return null; }
    }

    async function loadRecent() {
        const since = new Date(Date.now() - 60 * 60 * 1000).toISOString(); // last hour

        const { data } = await sb.from('live_plays')
            .select('plate, word, skipped, thinking_seconds, mode, created_at, user_id')
            .gte('created_at', since)
            .order('created_at', { ascending: false })
            .limit(MAX_ENTRIES);

        for (const e of (data || [])) {
            entries.push({
                plate: e.plate,
                word: e.word,
                skipped: e.skipped,
                time: e.thinking_seconds,
                mode: e.mode,
                at: new Date(e.created_at),
                userId: e.user_id,
                userName: null
            });
        }

        // Resolve usernames in background
        resolveAllUserNames();
        updateStats();
        renderFeed();
    }

    async function resolveAllUserNames() {
        for (const e of entries) {
            if (e.userName || !e.userId) continue;
            e.userName = await resolveUser(e.userId);
        }
        renderFeed();
    }

    function subscribe() {
        const channel = sb.channel('live-tracker');

        channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'live_plays' }, (payload) => {
            addEntry(payload.new);
        });

        channel.subscribe((status) => {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (status === 'SUBSCRIBED') {
                dot.className = 'dot';
                text.textContent = 'Live';
            } else {
                dot.className = 'dot off';
                text.textContent = status;
            }
        });
    }

    async function addEntry(row) {
        const e = {
            plate: row.plate,
            word: row.word,
            skipped: row.skipped,
            time: row.thinking_seconds,
            mode: row.mode,
            at: new Date(row.created_at || Date.now()),
            userId: row.user_id || null,
            userName: null
        };

        if (e.userId) {
            e.userName = await resolveUser(e.userId);
        }

        entries.unshift(e);
        if (entries.length > MAX_ENTRIES) entries.pop();
        sessionStats.total++;
        if (e.skipped) sessionStats.skips++;
        if (e.time != null) sessionStats.times.push(e.time);
        updateStats(true);

        // Prepend new entry to DOM instead of re-rendering everything
        if (activeFilter === 'all' || activeFilter === e.mode) {
            const feed = document.getElementById('feed');
            const empty = feed.querySelector('.empty');
            if (empty) empty.remove();
            const html = renderEntryHTML(e);
            feed.insertAdjacentHTML('afterbegin', html);
            // Trim excess DOM entries
            while (feed.children.length > 100) feed.removeChild(feed.lastChild);
        }
    }

    function updateStats(animate) {
        const todayEl = document.getElementById('statToday');
        const recentEl = document.getElementById('statRecent');
        todayEl.textContent = entries.length;
        const fiveMin = Date.now() - 5 * 60 * 1000;
        recentEl.textContent = entries.filter(e => e.at.getTime() > fiveMin).length;
        if (animate) {
            bumpEl(todayEl);
            bumpEl(recentEl);
        }
    }

    function bumpEl(el) {
        el.classList.remove('bump');
        void el.offsetWidth; // force reflow to restart animation
        el.classList.add('bump');
    }

    function updateRecentStat() {
        const fiveMin = Date.now() - 5 * 60 * 1000;
        document.getElementById('statRecent').textContent = entries.filter(e => e.at.getTime() > fiveMin).length;
    }

    function setFilter(mode, btn) {
        activeFilter = mode;
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderFeed();
    }

    function highlightWord(word, plate) {
        const upper = word.toUpperCase();
        const upperPlate = plate.toUpperCase();
        let result = '';
        let pi = 0;
        for (let i = 0; i < word.length; i++) {
            if (pi < upperPlate.length && upper[i] === upperPlate[pi]) {
                result += `<span class="pl">${word[i]}</span>`;
                pi++;
            } else {
                result += `<span class="nl">${word[i]}</span>`;
            }
        }
        return result;
    }

    function renderEntryHTML(e) {
        const wordHtml = e.skipped
            ? '<span class="word skipped">skipped</span>'
            : `<span class="word">${highlightWord(e.word || '?', e.plate)}</span>`;
        const timeStr = e.time != null ? e.time.toFixed(1) + 's' : '--';
        const user = e.userName ? esc(e.userName) : '<span style="color:#d1d5db;">anon</span>';
        return `<div class="entry entry-${e.mode}">
            <span class="user">${user}</span>
            <span class="plate">${esc(e.plate)}</span>
            ${wordHtml}
            <span class="time">${timeStr}</span>
            <span class="mode mode-${e.mode}">${e.mode}</span>
            <span class="ago">${ago(e.at)}</span>
        </div>`;
    }

    function renderFeed() {
        const feed = document.getElementById('feed');
        const filtered = activeFilter === 'all' ? entries : entries.filter(e => e.mode === activeFilter);

        if (filtered.length === 0) {
            feed.innerHTML = '<div class="empty">Waiting for plays...</div>';
            return;
        }

        feed.innerHTML = filtered.slice(0, 100).map(e => renderEntryHTML(e)).join('');
    }

    function updateAgos() {
        const agoEls = document.querySelectorAll('.entry .ago');
        const filtered = activeFilter === 'all' ? entries : entries.filter(e => e.mode === activeFilter);
        agoEls.forEach((el, i) => {
            if (filtered[i]) el.textContent = ago(filtered[i].at);
        });
    }

    function ago(date) {
        const s = (Date.now() - date.getTime()) / 1000;
        if (s < 10) return 'now';
        if (s < 60) return Math.floor(s) + 's';
        if (s < 3600) return Math.floor(s / 60) + 'm';
        if (s < 86400) return Math.floor(s / 3600) + 'h';
        return Math.floor(s / 86400) + 'd';
    }

    function esc(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; }
        .login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { text-align: center; }
        .login-box input { display: block; margin: 8px auto; padding: 10px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; width: 280px; }
        .login-box button { margin-top: 8px; background: #7c3aed; color: white; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; cursor: pointer; }
        .login-box button:hover { background: #6d28d9; }
        #loginError { color: #dc2626; margin-top: 8px; font-size: 13px; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 1.3rem; }
        .tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; }
        .tabs button { padding: 10px 24px; font-size: 14px; font-weight: 600; border: none; background: none; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tabs button.active { color: #7c3aed; border-bottom-color: #7c3aed; }
        .tabs button:hover { color: #374151; }
        .stats-bar { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 18px; min-width: 120px; }
        .stat-card .label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 1.4rem; font-weight: 700; margin-top: 2px; }
        .status-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 18px; display: flex; align-items: center; gap: 8px; }
        .status-card .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; flex-shrink: 0; }
        .status-card .dot.off { background: #ef4444; animation: none; }
        .status-card .status-label { font-size: 0.85rem; font-weight: 600; color: #374151; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .dot.off { background: #ef4444; animation: none; }
        .filters { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
        .filters button { padding: 6px 14px; border-radius: 20px; font-size: 12px; border: 1px solid #ddd; background: #fff; color: #6b7280; cursor: pointer; }
        .filters button.active { background: #7c3aed; color: white; border-color: #7c3aed; }
        .filters button:hover { border-color: #7c3aed; }
        .feed { display: flex; flex-direction: column; gap: 4px; }
        .entry { display: flex; align-items: center; gap: 16px; padding: 10px 14px; border-radius: 10px; border: 1px solid #e5e7eb; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
        .entry .user { font-size: 0.85rem; color: #374151; font-weight: 600; flex: 1; min-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .entry .plate { font-family: monospace; font-size: 1.1rem; font-weight: 700; color: #111; width: 60px; }
        .entry .word { font-size: 0.95rem; flex: 1.5; min-width: 130px; }
        .entry .word .pl { color: #16a34a; font-weight: 700; }
        .entry .word .nl { color: #111; }
        .entry .word.skipped { color: #dc2626; font-style: italic; }
        .entry .time-col { display: flex; align-items: center; gap: 6px; flex: 2; min-width: 160px; }
        .entry .time-val { font-size: 0.85rem; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
        .entry .time-bar { height: 6px; border-radius: 3px; flex-shrink: 0; }
        .entry .mode { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 10px; text-transform: uppercase; width: 70px; text-align: center; }
        .mode-daily { background: #fef3c7; color: #92400e; }
        .mode-practice { background: #ede9fe; color: #6d28d9; }
        .mode-endless { background: #d1fae5; color: #047857; }
        .mode-h2h { background: #1f2937; color: #f9fafb; }
        .mode-group { background: #dbeafe; color: #1e40af; }
        .entry .ago { font-size: 0.75rem; color: #9ca3af; width: 50px; text-align: right; }
        .entry-daily { background: #fefce8; border-color: #f59e0b; }
        .entry-practice { background: #fff; border-color: #a78bfa; }
        .entry-endless { background: #fff; border-color: #34d399; }
        .entry-h2h { background: #fff; border-color: #1f2937; }
        .entry-group { background: #fff; border-color: #3b82f6; }
        .empty { text-align: center; padding: 60px 20px; color: #9ca3af; }
        .feed-header { display: flex; align-items: center; gap: 16px; padding: 6px 14px; font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .feed-header .h-user { flex: 1; min-width: 100px; }
        .feed-header .h-plate { width: 60px; }
        .feed-header .h-word { flex: 1.5; min-width: 130px; }
        .feed-header .h-time { flex: 2; min-width: 160px; }
        .feed-header .h-mode { width: 70px; text-align: center; }
        .feed-header .h-ago { width: 50px; text-align: right; }
        .bump { display: inline-block; animation: bumpUp 0.5s ease-out; }
        @keyframes bumpUp { 0% { transform: translateY(0); } 30% { transform: translateY(-6px); color: #16a34a; } 100% { transform: translateY(0); } }
        /* Stats tab */
        .stats-panel { display: none; }
        .stats-panel.active { display: block; }
        .feed-panel { display: none; }
        .feed-panel.active { display: block; }
        .chart-container { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .chart-container h3 { font-size: 0.95rem; color: #374151; margin-bottom: 12px; }
        .records-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .record-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px 20px; }
        .record-card h3 { font-size: 0.85rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
        .record-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f3f4f6; }
        .record-item:last-child { border-bottom: none; }
        .record-word { font-weight: 700; font-size: 1rem; }
        .record-word .pl { color: #16a34a; font-weight: 700; }
        .record-word .nl { color: #111; }
        .record-meta { text-align: right; font-size: 0.8rem; color: #6b7280; }
        .record-meta .val { font-size: 1rem; font-weight: 700; color: #111; display: block; }
        .record-plate { font-family: monospace; font-weight: 700; color: #6b7280; font-size: 0.8rem; }
        .record-user { font-size: 0.75rem; color: #9ca3af; }
        .peak-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
        .peak-cell { text-align: center; padding: 6px 2px; border-radius: 6px; font-size: 11px; }
        .peak-cell .day { font-weight: 600; color: #6b7280; }
        .peak-cell .count { font-weight: 700; font-size: 1rem; margin-top: 2px; }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h2>Live Tracker</h2>
            <p style="color:#64748b;margin:8px 0 16px;">Enter password to continue</p>
            <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
            <button onclick="doLogin()">Sign In</button>
            <p id="loginError"></p>
        </div>
    </div>

    <div id="mainApp" style="display:none;">
        <div class="container">
            <div class="header">
                <h1>Live Tracker</h1>
            </div>
            <div class="stats-bar">
                <div class="status-card">
                    <div class="dot" id="statusDot"></div>
                    <span class="status-label" id="statusText">Connecting...</span>
                </div>
                <div class="stat-card"><div class="label">Last hour</div><div class="value" id="statHour">0</div></div>
                <div class="stat-card"><div class="label">Last 5 min</div><div class="value" id="statRecent">0</div></div>
                <div style="display:flex;flex-direction:column;gap:3px;">
                    <div class="stat-card" style="padding:6px 14px;min-width:auto;">
                        <div style="display:flex;align-items:center;gap:6px;">
                            <span class="label" style="margin:0;">Today</span>
                            <span style="font-size:1.1rem;font-weight:700;" id="statToday">0</span>
                        </div>
                    </div>
                    <div style="display:flex;gap:3px;">
                        <span class="mode mode-daily" style="font-size:8px;padding:2px 5px;cursor:default;flex:1;text-align:center;" id="splitDaily">0</span>
                        <span class="mode mode-practice" style="font-size:8px;padding:2px 5px;cursor:default;flex:1;text-align:center;" id="splitPractice">0</span>
                        <span class="mode mode-endless" style="font-size:8px;padding:2px 5px;cursor:default;flex:1;text-align:center;" id="splitEndless">0</span>
                        <span class="mode mode-h2h" style="font-size:8px;padding:2px 5px;cursor:default;flex:1;text-align:center;" id="splitH2h">0</span>
                        <span class="mode mode-group" style="font-size:8px;padding:2px 5px;cursor:default;flex:1;text-align:center;" id="splitGroup">0</span>
                    </div>
                </div>
            </div>
            <div class="tabs">
                <button class="active" onclick="switchTab('feed',this)">Feed</button>
                <button onclick="switchTab('stats',this)">Stats</button>
            </div>

            <!-- Feed Tab -->
            <div class="feed-panel active" id="feedPanel">
                <div class="filters">
                    <button class="active" data-mode="all" onclick="setFilter('all',this)">All</button>
                    <button data-mode="daily" onclick="setFilter('daily',this)">Daily</button>
                    <button data-mode="practice" onclick="setFilter('practice',this)">Practice</button>
                    <button data-mode="endless" onclick="setFilter('endless',this)">Endless</button>
                    <button data-mode="h2h" onclick="setFilter('h2h',this)">H2H</button>
                    <button data-mode="group" onclick="setFilter('group',this)">Group</button>
                </div>
                <div class="feed-header">
                    <span class="h-user">Player</span>
                    <span class="h-plate">Plate</span>
                    <span class="h-word">Word</span>
                    <span class="h-time">Time</span>
                    <span class="h-mode">Mode</span>
                    <span class="h-ago"></span>
                </div>
                <div class="feed" id="feed">
                    <div class="empty">Waiting for plays...</div>
                </div>
            </div>

            <!-- Stats Tab -->
            <div class="stats-panel" id="statsPanel">
                <div class="records-grid">
                    <div class="record-card">
                        <h3>Longest Words (Today)</h3>
                        <div id="longestWords"><div class="empty" style="padding:20px;">Loading...</div></div>
                    </div>
                    <div class="record-card">
                        <h3>Fastest Solves (Today)</h3>
                        <div id="fastestSolves"><div class="empty" style="padding:20px;">Loading...</div></div>
                    </div>
                </div>
                <div class="chart-container">
                    <h3>Activity — Last 24 Hours</h3>
                    <canvas id="activityChart" height="80"></canvas>
                </div>
                <div class="chart-container">
                    <h3>Plays Per Day — Last 7 Days</h3>
                    <div class="peak-grid" id="weekGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
    const SUPABASE_URL = 'https://ggbvtaegsnlimscmjirf.supabase.co';
    const SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnYnZ0YWVnc25saW1zY21qaXJmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NTkxOTA1NSwiZXhwIjoyMDkxNDk1MDU1fQ.b_qDqjP-Nadk_M_kACc5mJB_OR_-Cx80vOgOfLYsDLQ';
    const sb = window.supabase.createClient(SUPABASE_URL, SERVICE_KEY, {
        auth: { persistSession: false, autoRefreshToken: false }
    });

    const MAX_ENTRIES = 200;
    let entries = [];
    let profileCache = {};
    let activeFilter = 'all';
    let activeTab = 'feed';
    let statsLoaded = false;
    let activityChart = null;
    let todayCount = 0; // actual full-day count from DB
    let todaySplits = { daily: 0, practice: 0, endless: 0, h2h: 0, group: 0 };

    function doLogin() {
        const pw = document.getElementById('pw').value.trim();
        if (pw === 'live') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            init();
        } else {
            document.getElementById('loginError').textContent = 'Wrong password';
            document.getElementById('pw').value = '';
        }
    }

    // --- Tabs ---
    function switchTab(tab, btn) {
        activeTab = tab;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('feedPanel').className = tab === 'feed' ? 'feed-panel active' : 'feed-panel';
        document.getElementById('statsPanel').className = tab === 'stats' ? 'stats-panel active' : 'stats-panel';
        if (tab === 'stats' && !statsLoaded) {
            loadStats();
            statsLoaded = true;
        }
    }

    // --- Init ---
    async function init() {
        await loadRecent();
        subscribe();
        setInterval(updateAgos, 30000);
        setInterval(updateRecentStat, 30000);
    }

    async function resolveUser(userId) {
        if (!userId) return null;
        if (profileCache[userId]) return profileCache[userId];
        try {
            const { data } = await sb.from('profiles').select('display_name, handle').eq('id', userId).single();
            const name = data?.display_name || (data?.handle ? '@' + data.handle : null);
            profileCache[userId] = name;
            return name;
        } catch { return null; }
    }

    async function loadRecent() {
        const since = new Date(Date.now() - 60 * 60 * 1000).toISOString();
        const today = new Date().toISOString().slice(0, 10) + 'T00:00:00Z';

        // Fetch last hour for feed + today counts per mode in parallel
        const modes = ['daily', 'practice', 'endless', 'h2h', 'group'];
        const [feedRes, ...modeCounts] = await Promise.all([
            sb.from('live_plays')
                .select('plate, word, skipped, thinking_seconds, mode, created_at, user_id')
                .gte('created_at', since)
                .order('created_at', { ascending: false })
                .limit(MAX_ENTRIES),
            ...modes.map(m => sb.from('live_plays').select('id', { count: 'exact', head: true }).gte('created_at', today).eq('mode', m))
        ]);

        todayCount = 0;
        modes.forEach((m, i) => {
            todaySplits[m] = modeCounts[i].count || 0;
            todayCount += todaySplits[m];
        });
        const data = feedRes.data;

        for (const e of (data || [])) {
            entries.push({
                plate: e.plate, word: e.word, skipped: e.skipped,
                time: e.thinking_seconds, mode: e.mode,
                at: new Date(e.created_at), userId: e.user_id, userName: null
            });
        }
        resolveAllUserNames();
        updateStats();
        renderFeed();
    }

    async function resolveAllUserNames() {
        for (const e of entries) {
            if (e.userName || !e.userId) continue;
            e.userName = await resolveUser(e.userId);
        }
        renderFeed();
    }

    function subscribe() {
        const channel = sb.channel('live-tracker');
        channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'live_plays' }, (payload) => {
            addEntry(payload.new);
        });
        channel.subscribe((status) => {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (status === 'SUBSCRIBED') { dot.className = 'dot'; text.textContent = 'Live'; }
            else { dot.className = 'dot off'; text.textContent = status; }
        });
    }

    async function addEntry(row) {
        const e = {
            plate: row.plate, word: row.word, skipped: row.skipped,
            time: row.thinking_seconds, mode: row.mode,
            at: new Date(row.created_at || Date.now()), userId: row.user_id || null, userName: null
        };
        if (e.userId) e.userName = await resolveUser(e.userId);

        entries.unshift(e);
        if (entries.length > MAX_ENTRIES) entries.pop();
        todayCount++;
        if (e.mode in todaySplits) todaySplits[e.mode]++;
        updateStats(true);

        if (activeFilter === 'all' || activeFilter === e.mode) {
            const feed = document.getElementById('feed');
            const empty = feed.querySelector('.empty');
            if (empty) empty.remove();
            feed.insertAdjacentHTML('afterbegin', renderEntryHTML(e));
            while (feed.children.length > 100) feed.removeChild(feed.lastChild);
        }

        // Update stats tab live records if visible
        if (activeTab === 'stats' && !e.skipped && e.word) {
            updateLiveRecords(e);
        }
    }

    function updateStats(animate) {
        const todayEl = document.getElementById('statToday');
        const hourEl = document.getElementById('statHour');
        const recentEl = document.getElementById('statRecent');
        todayEl.textContent = todayCount;
        const oneHour = Date.now() - 60 * 60 * 1000;
        const fiveMin = Date.now() - 5 * 60 * 1000;
        hourEl.textContent = entries.filter(e => e.at.getTime() > oneHour).length;
        recentEl.textContent = entries.filter(e => e.at.getTime() > fiveMin).length;
        // Update mode splits
        document.getElementById('splitDaily').textContent = todaySplits.daily;
        document.getElementById('splitPractice').textContent = todaySplits.practice;
        document.getElementById('splitEndless').textContent = todaySplits.endless;
        document.getElementById('splitH2h').textContent = todaySplits.h2h;
        document.getElementById('splitGroup').textContent = todaySplits.group;
        if (animate) { bumpEl(todayEl); bumpEl(hourEl); bumpEl(recentEl); }
    }

    function bumpEl(el) {
        el.classList.remove('bump');
        void el.offsetWidth;
        el.classList.add('bump');
    }

    function updateRecentStat() {
        const oneHour = Date.now() - 60 * 60 * 1000;
        const fiveMin = Date.now() - 5 * 60 * 1000;
        document.getElementById('statHour').textContent = entries.filter(e => e.at.getTime() > oneHour).length;
        document.getElementById('statRecent').textContent = entries.filter(e => e.at.getTime() > fiveMin).length;
    }

    function setFilter(mode, btn) {
        activeFilter = mode;
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderFeed();
    }

    function highlightWord(word, plate) {
        const upper = word.toUpperCase();
        const upperPlate = plate.toUpperCase();
        let result = '';
        let pi = 0;
        for (let i = 0; i < word.length; i++) {
            if (pi < upperPlate.length && upper[i] === upperPlate[pi]) {
                result += `<span class="pl">${word[i]}</span>`;
                pi++;
            } else {
                result += `<span class="nl">${word[i]}</span>`;
            }
        }
        return result;
    }

    function timeColor(seconds) {
        if (seconds == null) return '#6b7280';
        // Smooth gradient: 0s = green(22,163,74) → 10s = yellow(202,138,4) → 20s+ = red(220,38,38)
        const t = Math.min(Math.max(seconds / 20, 0), 1);
        let r, g, b;
        if (t < 0.5) {
            const f = t / 0.5;
            r = Math.round(22 + (202 - 22) * f);
            g = Math.round(163 + (138 - 163) * f);
            b = Math.round(74 + (4 - 74) * f);
        } else {
            const f = (t - 0.5) / 0.5;
            r = Math.round(202 + (220 - 202) * f);
            g = Math.round(138 + (38 - 138) * f);
            b = Math.round(4 + (38 - 4) * f);
        }
        return `rgb(${r},${g},${b})`;
    }

    function timeBarWidth(seconds) {
        if (seconds == null) return 0;
        // Scale: 0s = 0%, 30s+ = 100%
        return Math.min(Math.max(seconds / 30 * 100, 3), 100);
    }

    function renderEntryHTML(e) {
        const wordHtml = e.skipped
            ? '<span class="word skipped">skipped</span>'
            : `<span class="word">${highlightWord(e.word || '?', e.plate)}</span>`;
        const timeStr = e.time != null ? e.time.toFixed(1) + 's' : '--';
        const barColor = e.skipped ? '#111' : timeColor(e.time);
        const barW = timeBarWidth(e.time);
        const user = e.userName ? esc(e.userName) : '<span style="color:#d1d5db;">anon</span>';
        return `<div class="entry entry-${e.mode}">
            <span class="user">${user}</span>
            <span class="plate">${esc(e.plate)}</span>
            ${wordHtml}
            <span class="time-col">
                <span class="time-val" style="color:${barColor}">${timeStr}</span>
                <span class="time-bar" style="width:${barW}%;background:${barColor};"></span>
            </span>
            <span class="mode mode-${e.mode}">${e.mode}</span>
            <span class="ago">${ago(e.at)}</span>
        </div>`;
    }

    function renderFeed() {
        const feed = document.getElementById('feed');
        const filtered = activeFilter === 'all' ? entries : entries.filter(e => e.mode === activeFilter);
        if (filtered.length === 0) { feed.innerHTML = '<div class="empty">Waiting for plays...</div>'; return; }
        feed.innerHTML = filtered.slice(0, 100).map(e => renderEntryHTML(e)).join('');
    }

    function updateAgos() {
        const agoEls = document.querySelectorAll('.entry .ago');
        const filtered = activeFilter === 'all' ? entries : entries.filter(e => e.mode === activeFilter);
        agoEls.forEach((el, i) => { if (filtered[i]) el.textContent = ago(filtered[i].at); });
    }

    // ==================== STATS TAB ====================

    let todayLongest = [];
    let todayFastest = [];

    async function loadStats() {
        const today = new Date().toISOString().slice(0, 10);
        const dayStart = today + 'T00:00:00Z';

        // Fetch today's plays for records
        const { data: todayPlays } = await sb.from('live_plays')
            .select('plate, word, skipped, thinking_seconds, user_id, created_at')
            .gte('created_at', dayStart)
            .eq('skipped', false)
            .order('created_at', { ascending: false })
            .limit(2000);

        if (todayPlays) {
            // Longest words
            todayLongest = todayPlays
                .filter(p => p.word)
                .sort((a, b) => b.word.length - a.word.length)
                .slice(0, 10);

            // Fastest solves (min 4 char word)
            todayFastest = todayPlays
                .filter(p => p.word && p.word.length >= 4 && p.thinking_seconds != null && p.thinking_seconds > 0)
                .sort((a, b) => a.thinking_seconds - b.thinking_seconds)
                .slice(0, 10);
        }

        await renderRecords();
        await loadActivityChart();
        await loadWeekGrid();
    }

    async function renderRecords() {
        // Longest words
        const longestEl = document.getElementById('longestWords');
        if (todayLongest.length === 0) {
            longestEl.innerHTML = '<div style="color:#9ca3af;padding:12px;">No plays today yet</div>';
        } else {
            let html = '';
            for (const p of todayLongest) {
                const name = await resolveUser(p.user_id) || 'anon';
                html += `<div class="record-item">
                    <div>
                        <span class="record-word">${highlightWord(p.word, p.plate)}</span>
                        <span class="record-plate">${p.plate}</span>
                    </div>
                    <div class="record-meta">
                        <span class="val">${p.word.length} letters</span>
                        <span class="record-user">${esc(name)}</span>
                    </div>
                </div>`;
            }
            longestEl.innerHTML = html;
        }

        // Fastest solves
        const fastestEl = document.getElementById('fastestSolves');
        if (todayFastest.length === 0) {
            fastestEl.innerHTML = '<div style="color:#9ca3af;padding:12px;">No plays today yet</div>';
        } else {
            let html = '';
            for (const p of todayFastest) {
                const name = await resolveUser(p.user_id) || 'anon';
                html += `<div class="record-item">
                    <div>
                        <span class="record-word">${highlightWord(p.word, p.plate)}</span>
                        <span class="record-plate">${p.plate}</span>
                    </div>
                    <div class="record-meta">
                        <span class="val">${p.thinking_seconds.toFixed(2)}s</span>
                        <span class="record-user">${esc(name)}</span>
                    </div>
                </div>`;
            }
            fastestEl.innerHTML = html;
        }
    }

    function updateLiveRecords(e) {
        // Check if this entry belongs in longest or fastest
        let needsRerender = false;
        if (e.word && (todayLongest.length < 10 || e.word.length > todayLongest[todayLongest.length - 1]?.word?.length)) {
            todayLongest.push({ plate: e.plate, word: e.word, thinking_seconds: e.time, user_id: e.userId });
            todayLongest.sort((a, b) => b.word.length - a.word.length);
            todayLongest = todayLongest.slice(0, 10);
            needsRerender = true;
        }
        if (e.word && e.word.length >= 4 && e.time > 0 && (todayFastest.length < 10 || e.time < todayFastest[todayFastest.length - 1]?.thinking_seconds)) {
            todayFastest.push({ plate: e.plate, word: e.word, thinking_seconds: e.time, user_id: e.userId });
            todayFastest.sort((a, b) => a.thinking_seconds - b.thinking_seconds);
            todayFastest = todayFastest.slice(0, 10);
            needsRerender = true;
        }
        if (needsRerender) renderRecords();
    }

    async function fetchAllEntryTimestamps(sinceDate) {
        // daily_run_entries: join daily_runs for completed_at
        // practice_plate_stats: has created_at directly
        // h2h_run_entries: join h2h_runs for created_at
        // group_daily_run_entries: join group_daily_runs for completed_at
        const [daily, practice, h2h, group] = await Promise.all([
            sb.from('daily_run_entries').select('run:daily_runs!inner(completed_at)').gte('run.completed_at', sinceDate).limit(10000),
            sb.from('practice_plate_stats').select('created_at').gte('created_at', sinceDate).limit(10000),
            sb.from('h2h_run_entries').select('run:h2h_runs!inner(created_at)').gte('run.created_at', sinceDate).limit(10000),
            sb.from('group_daily_run_entries').select('run:group_daily_runs!inner(completed_at)').gte('run.completed_at', sinceDate).limit(10000),
        ]);
        const timestamps = [];
        for (const r of (daily.data || [])) timestamps.push(r.run?.completed_at);
        for (const r of (practice.data || [])) timestamps.push(r.created_at);
        for (const r of (h2h.data || [])) timestamps.push(r.run?.created_at);
        for (const r of (group.data || [])) timestamps.push(r.run?.completed_at);
        return timestamps.filter(Boolean);
    }

    async function loadActivityChart() {
        const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
        const allTimestamps = await fetchAllEntryTimestamps(since);

        // Bucket into 30-min intervals
        const buckets = {};
        const now = Date.now();
        for (let i = 0; i < 48; i++) {
            const t = now - (47 - i) * 30 * 60 * 1000;
            const key = new Date(t).toISOString().slice(0, 16);
            buckets[key] = 0;
        }

        for (const ts of allTimestamps) {
            const t = new Date(ts);
            const mins = t.getMinutes();
            t.setMinutes(mins < 30 ? 0 : 30, 0, 0);
            const key = t.toISOString().slice(0, 16);
            if (key in buckets) buckets[key]++;
        }

        const labels = Object.keys(buckets).map(k => {
            const d = new Date(k + ':00Z');
            return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        });
        const values = Object.values(buckets);

        const ctx = document.getElementById('activityChart').getContext('2d');
        if (activityChart) activityChart.destroy();
        activityChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels,
                datasets: [{
                    data: values,
                    backgroundColor: '#a78bfa',
                    borderRadius: 4,
                    barPercentage: 0.8,
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    x: {
                        ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 12, font: { size: 10 }, color: '#9ca3af' },
                        grid: { display: false }
                    },
                    y: {
                        beginAtZero: true,
                        ticks: { stepSize: 1, font: { size: 10 }, color: '#9ca3af' },
                        grid: { color: '#f3f4f6' }
                    }
                }
            }
        });
    }

    async function loadWeekGrid() {
        const grid = document.getElementById('weekGrid');
        const days = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date(Date.now() - i * 86400000);
            days.push(d.toISOString().slice(0, 10));
        }

        // Count plays per day from all entry tables
        const counts = {};
        for (const d of days) counts[d] = 0;

        const allTimestamps = await fetchAllEntryTimestamps(days[0] + 'T00:00:00Z');
        for (const ts of allTimestamps) {
            const day = ts.slice(0, 10);
            if (day in counts) counts[day]++;
        }

        const maxCount = Math.max(...Object.values(counts), 1);
        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        let html = '';
        for (const d of days) {
            const dt = new Date(d + 'T12:00:00');
            const dayName = dayNames[dt.getDay()];
            const count = counts[d];
            const intensity = count / maxCount;
            const bg = `rgba(124, 58, 237, ${0.08 + intensity * 0.35})`;
            html += `<div class="peak-cell" style="background:${bg};">
                <div class="day">${dayName}</div>
                <div class="count">${count}</div>
            </div>`;
        }
        grid.innerHTML = html;
    }

    // ==================== UTILITY ====================

    function ago(date) {
        const s = (Date.now() - date.getTime()) / 1000;
        if (s < 10) return 'now';
        if (s < 60) return Math.floor(s) + 's';
        if (s < 3600) return Math.floor(s / 60) + 'm';
        if (s < 86400) return Math.floor(s / 3600) + 'h';
        return Math.floor(s / 86400) + 'd';
    }

    function esc(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

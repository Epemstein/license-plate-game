<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; height: 100vh; }
        .sidebar { width: 300px; background: #fff; border-right: 1px solid #e0e0e0; overflow-y: auto; flex-shrink: 0; }
        .sidebar h2 { padding: 16px; font-size: 18px; border-bottom: 1px solid #e0e0e0; }
        .user-item { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .user-item:hover { background: #f8f8f8; }
        .user-item.active { background: #ede9fe; border-left: 3px solid #7c3aed; }
        .user-item .name { font-weight: 600; font-size: 14px; }
        .user-item .preview { font-size: 12px; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-item .meta { font-size: 11px; color: #aaa; margin-top: 2px; }
        .user-item .unread { display: inline-block; background: #7c3aed; color: white; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; margin-left: 6px; }
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 16px; border-bottom: 1px solid #e0e0e0; background: #fff; font-weight: 600; font-size: 16px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 16px; }
        .chat-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #aaa; font-size: 14px; }
        .msg { max-width: 70%; margin-bottom: 8px; display: flex; flex-direction: column; }
        .msg.user { align-self: flex-start; }
        .msg.admin { align-self: flex-end; }
        .chat-messages { display: flex; flex-direction: column; }
        .msg .bubble { padding: 8px 12px; border-radius: 16px; font-size: 14px; line-height: 1.4; display: inline-block; }
        .msg.user .bubble { background: #e5e7eb; color: #111; }
        .msg.admin .bubble { background: #7c3aed; color: white; }
        .msg .time { font-size: 10px; color: #aaa; margin-top: 2px; padding: 0 4px; }
        .msg.admin .time { text-align: right; }
        .chat-input { display: flex; padding: 12px 16px; border-top: 1px solid #e0e0e0; background: #fff; gap: 8px; }
        .chat-input textarea { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 8px 14px; font-size: 14px; resize: none; font-family: inherit; outline: none; }
        .chat-input textarea:focus { border-color: #7c3aed; }
        .chat-input button { background: #7c3aed; color: white; border: none; border-radius: 20px; padding: 8px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .chat-input button:hover { background: #6d28d9; }
        .chat-input button:disabled { background: #ccc; cursor: not-allowed; }
        .login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100%; }
        .login-box { text-align: center; }
        .login-box input { display: block; margin: 8px auto; padding: 10px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; width: 280px; }
        .login-box button { margin-top: 8px; background: #7c3aed; color: white; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h2>Feedback Admin</h2>
            <p style="color:#888;margin:8px 0 16px;">Enter password to continue</p>
            <input type="password" id="adminPassword" placeholder="Password" onkeydown="if(event.key==='Enter')adminLogin()">
            <button onclick="adminLogin()">Sign In</button>
            <p id="loginError" style="color:red;margin-top:8px;font-size:13px;"></p>
        </div>
    </div>

    <div id="mainApp" style="display:none;width:100%;display:none;">
        <div class="sidebar">
            <h2>Conversations</h2>
            <div id="userList"></div>
        </div>
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">Select a conversation</div>
            <div class="chat-messages" id="chatMessages">
                <div class="chat-empty">Select a user to view their feedback</div>
            </div>
            <div class="chat-input" id="chatInput" style="display:none;">
                <textarea id="replyText" rows="1" placeholder="Reply as admin..."></textarea>
                <button id="sendBtn" onclick="sendReply()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ggbvtaegsnlimscmjirf.supabase.co';
        const SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnYnZ0YWVnc25saW1zY21qaXJmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NTkxOTA1NSwiZXhwIjoyMDkxNDk1MDU1fQ.b_qDqjP-Nadk_M_kACc5mJB_OR_-Cx80vOgOfLYsDLQ';
        const sb = window.supabase.createClient(SUPABASE_URL, SERVICE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false }
        });

        let selectedUserId = null;
        let conversations = {};
        let pollInterval = null;

        function adminLogin() {
            const pw = document.getElementById('adminPassword').value.trim();
            if (pw === 'Admin') {
                document.getElementById('loginScreen').style.display = 'none';
                const app = document.getElementById('mainApp');
                app.style.display = 'flex';
                loadConversations();
                pollInterval = setInterval(loadConversations, 5000);
            } else {
                document.getElementById('loginError').textContent = 'Wrong password';
                document.getElementById('adminPassword').value = '';
            }
            return false;
        }
        // Auto-login if loaded inside admin wrapper
        if (new URLSearchParams(window.location.search).get('auth') === 'Admin') {
            document.getElementById('adminPassword').value = 'Admin';
            adminLogin();
        }

        function updateUnreadBadge() {
            const badges = document.querySelectorAll('.user-item .unread');
            const count = badges.length;
            // Post message to parent (admin.html) with unread count
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'feedbackUnread', count }, '*');
            }
        }

        async function loadConversations() {
            const { data: messages, error } = await sb
                .from('feedback_messages')
                .select('id, user_id, text, from_admin, created_at, image_url')
                .order('created_at', { ascending: true });

            if (error || !messages) return;

            // Group by user
            conversations = {};
            for (const m of messages) {
                if (!conversations[m.user_id]) conversations[m.user_id] = [];
                conversations[m.user_id].push(m);
            }

            // Fetch profiles
            const userIds = Object.keys(conversations);
            if (userIds.length === 0) {
                document.getElementById('userList').innerHTML = '<div style="padding:16px;color:#aaa;text-align:center;">No feedback yet</div>';
                return;
            }

            const { data: profiles } = await sb
                .from('profiles')
                .select('id, display_name, handle')
                .in('id', userIds);

            const profileMap = {};
            for (const p of (profiles || [])) {
                profileMap[p.id] = p.display_name || (p.handle ? '@' + p.handle : 'Unknown');
            }

            // Sort by latest message
            const sorted = userIds.sort((a, b) => {
                const aLast = conversations[a][conversations[a].length - 1].created_at;
                const bLast = conversations[b][conversations[b].length - 1].created_at;
                return bLast.localeCompare(aLast);
            });

            let html = '';
            for (const uid of sorted) {
                const msgs = conversations[uid];
                const last = msgs[msgs.length - 1];
                const name = profileMap[uid] || uid.slice(0, 8);
                const lastReadKey = `feedback_read_${uid}`;
                const lastRead = localStorage.getItem(lastReadKey) || '';
                const hasUnread = !last.from_admin && last.created_at > lastRead;
                const ago = timeAgo(last.created_at);
                html += `<div class="user-item ${selectedUserId === uid ? 'active' : ''}" onclick="selectUser('${uid}')">`;
                html += `<div class="name">${name}${hasUnread ? '<span class="unread">new</span>' : ''}</div>`;
                html += `<div class="preview">${last.from_admin ? 'You: ' : ''}${last.text.slice(0, 60)}</div>`;
                html += `<div class="meta">${ago} · ${msgs.length} message${msgs.length > 1 ? 's' : ''}</div>`;
                html += `</div>`;
            }
            document.getElementById('userList').innerHTML = html;
            updateUnreadBadge();

            // Refresh current chat
            if (selectedUserId && conversations[selectedUserId]) {
                renderChat(selectedUserId, profileMap[selectedUserId] || selectedUserId.slice(0, 8));
            }
        }

        function selectUser(uid) {
            selectedUserId = uid;
            const items = document.querySelectorAll('.user-item');
            items.forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Mark as read
            localStorage.setItem(`feedback_read_${uid}`, new Date().toISOString());
            // Remove "new" badge from this item
            const badge = event.currentTarget.querySelector('.unread');
            if (badge) badge.remove();
            // Notify parent to update tab badge
            updateUnreadBadge();

            const name = event.currentTarget.querySelector('.name').textContent.replace(/new$/, '').trim();
            renderChat(uid, name);
        }

        function renderChat(uid, name) {
            document.getElementById('chatHeader').textContent = name;
            document.getElementById('chatInput').style.display = 'flex';

            const msgs = conversations[uid] || [];
            let html = '';
            for (const m of msgs) {
                const cls = m.from_admin ? 'admin' : 'user';
                html += `<div class="msg ${cls}">`;
                if (m.image_url) {
                    html += `<div><img src="${m.image_url}" style="max-width:300px;max-height:400px;border-radius:12px;margin-bottom:4px;cursor:pointer;" onclick="window.open('${m.image_url}','_blank')"></div>`;
                }
                if (m.text) html += `<div class="bubble">${escapeHtml(m.text)}</div>`;
                html += `<div class="time">${timeAgo(m.created_at)}</div>`;
                html += `</div>`;
            }
            const el = document.getElementById('chatMessages');
            el.innerHTML = html;
            el.scrollTop = el.scrollHeight;
        }

        async function sendReply() {
            if (!selectedUserId) return;
            const textarea = document.getElementById('replyText');
            const text = textarea.value.trim();
            if (!text) return;

            document.getElementById('sendBtn').disabled = true;
            textarea.value = '';

            const { error } = await sb
                .from('feedback_messages')
                .insert({ user_id: selectedUserId, text, from_admin: true });

            if (error) {
                alert('Error sending: ' + error.message);
                textarea.value = text;
            }

            document.getElementById('sendBtn').disabled = false;
            await loadConversations();
        }

        // Enter to send
        document.addEventListener('keydown', (e) => {
            if (e.target.id === 'replyText' && e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendReply();
            }
        });

        function timeAgo(iso) {
            const diff = (Date.now() - new Date(iso).getTime()) / 1000;
            if (diff < 60) return 'just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            return Math.floor(diff / 86400) + 'd ago';
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>
</html>

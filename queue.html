<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Match Queue</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 1.3rem; margin-bottom: 16px; }
        .stats-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 18px; min-width: 120px; text-align: center; }
        .stat-card .label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .val { font-size: 1.3rem; font-weight: 700; margin-top: 4px; }
        .queue-table { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
        .queue-table h3 { font-size: 0.85rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; padding: 14px 16px 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 8px 12px; border-bottom: 2px solid #e5e7eb; font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 8px 12px; border-bottom: 1px solid #f3f4f6; }
        tr:hover { background: #f9fafb; }
        .status-waiting { color: #f59e0b; font-weight: 600; }
        .status-matched { color: #16a34a; font-weight: 600; }
        .status-expired { color: #9ca3af; font-weight: 600; }
        .empty { text-align: center; padding: 40px; color: #9ca3af; }
        .refresh-btn { background: #7c3aed; color: white; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; margin-bottom: 16px; }
        .refresh-btn:hover { background: #6d28d9; }
    </style>
</head>
<body>
<div class="container">
    <h1>Quick Match Queue</h1>
    <button class="refresh-btn" onclick="loadQueue()">Refresh</button>

    <div id="stats" class="stats-row"></div>
    <div id="queueTable" class="queue-table">
        <div class="empty">Loading...</div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://ggbvtaegsnlimscmjirf.supabase.co';
const SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnYnZ0YWVnc25saW1zY21qaXJmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NTkxOTA1NSwiZXhwIjoyMDkxNDk1MDU1fQ.b_qDqjP-Nadk_M_kACc5mJB_OR_-Cx80vOgOfLYsDLQ';
const sb = window.supabase.createClient(SUPABASE_URL, SERVICE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false }
});

async function loadQueue() {
    // Fetch queue entries
    const { data: queue } = await sb
        .from('h2h_queue')
        .select('id, challenge_id, user_id, status, created_at')
        .order('created_at', { ascending: false })
        .limit(200);

    // Fetch matching challenges
    const challengeIds = (queue || []).map(q => q.challenge_id);
    let challenges = {};
    if (challengeIds.length > 0) {
        const { data: cRows } = await sb
            .from('h2h_challenges')
            .select('id, challenger_id, opponent_id, status, difficulty, created_at, completed_at')
            .in('id', challengeIds);
        (cRows || []).forEach(c => { challenges[c.id] = c; });
    }

    // Fetch profiles for all user IDs
    const userIds = new Set();
    (queue || []).forEach(q => userIds.add(q.user_id));
    Object.values(challenges).forEach(c => {
        if (c.challenger_id) userIds.add(c.challenger_id);
        if (c.opponent_id) userIds.add(c.opponent_id);
    });

    let profiles = {};
    if (userIds.size > 0) {
        const { data: pRows } = await sb
            .from('profiles')
            .select('id, display_name, handle')
            .in('id', [...userIds]);
        (pRows || []).forEach(p => { profiles[p.id] = p; });
    }

    // Fetch runs for these challenges
    let runs = {};
    if (challengeIds.length > 0) {
        const { data: rRows } = await sb
            .from('h2h_runs')
            .select('challenge_id, user_id, total_seconds')
            .in('challenge_id', challengeIds);
        (rRows || []).forEach(r => {
            if (!runs[r.challenge_id]) runs[r.challenge_id] = [];
            runs[r.challenge_id].push(r);
        });
    }

    // Stats
    const waiting = (queue || []).filter(q => q.status === 'waiting').length;
    const matched = (queue || []).filter(q => q.status === 'matched').length;
    const expired = (queue || []).filter(q => q.status === 'expired').length;
    const total = (queue || []).length;

    document.getElementById('stats').innerHTML = `
        <div class="stat-card"><div class="label">Total</div><div class="val">${total}</div></div>
        <div class="stat-card"><div class="label">Waiting</div><div class="val" style="color:#f59e0b;">${waiting}</div></div>
        <div class="stat-card"><div class="label">Matched</div><div class="val" style="color:#16a34a;">${matched}</div></div>
        <div class="stat-card"><div class="label">Expired</div><div class="val" style="color:#9ca3af;">${expired}</div></div>
    `;

    // Table
    if (!queue || queue.length === 0) {
        document.getElementById('queueTable').innerHTML = '<div class="empty">No queue entries yet</div>';
        return;
    }

    const getName = (id) => {
        const p = profiles[id];
        return p ? (p.display_name || p.handle || id.slice(0, 8)) : id.slice(0, 8);
    };

    const timeAgo = (dateStr) => {
        const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
        if (diff < 60) return 'just now';
        if (diff < 3600) return Math.round(diff / 60) + 'm ago';
        if (diff < 86400) return Math.round(diff / 3600) + 'h ago';
        return Math.round(diff / 86400) + 'd ago';
    };

    // Fetch message counts for all challenges
    let msgCounts = {};
    if (challengeIds.length > 0) {
        const { data: msgs } = await sb
            .from('h2h_messages')
            .select('challenge_id')
            .in('challenge_id', challengeIds);
        (msgs || []).forEach(m => {
            msgCounts[m.challenge_id] = (msgCounts[m.challenge_id] || 0) + 1;
        });
    }

    let html = '<h3>Queue Entries</h3><table><thead><tr>';
    html += '<th>Player</th><th>Status</th><th>Opponent</th><th>Challenger Score</th><th>Opponent Score</th><th>Created</th><th>Chat</th>';
    html += '</tr></thead><tbody>';

    (queue || []).forEach(q => {
        const c = challenges[q.challenge_id] || {};
        const statusClass = `status-${q.status}`;
        const opponentId = c.opponent_id && c.opponent_id !== q.user_id ? c.opponent_id : null;
        const opponentName = opponentId ? getName(opponentId) : '--';
        const challengeRuns = runs[q.challenge_id] || [];
        const myRun = challengeRuns.find(r => r.user_id === q.user_id);
        const oppRun = opponentId ? challengeRuns.find(r => r.user_id === opponentId) : null;
        const myScore = myRun?.total_seconds != null ? myRun.total_seconds.toFixed(1) + 's' : 'TBD';
        const oppScore = oppRun?.total_seconds != null ? oppRun.total_seconds.toFixed(1) + 's' : opponentId ? 'TBD' : '--';
        const count = msgCounts[q.challenge_id] || 0;
        const chatBtn = count > 0
            ? `<button onclick="showChat('${q.challenge_id}')" style="background:#7c3aed;color:white;border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;">${count} msg${count > 1 ? 's' : ''}</button>`
            : '<span style="color:#d1d5db;">--</span>';

        html += `<tr>
            <td><strong>${getName(q.user_id)}</strong></td>
            <td class="${statusClass}">${q.status}</td>
            <td>${opponentName}</td>
            <td>${myScore}</td>
            <td>${oppScore}</td>
            <td>${timeAgo(q.created_at)}</td>
            <td>${chatBtn}</td>
        </tr>`;
    });

    html += '</tbody></table>';
    document.getElementById('queueTable').innerHTML = html;
}

async function showChat(challengeId) {
    const { data: msgs } = await sb
        .from('h2h_messages')
        .select('user_id, text, created_at')
        .eq('challenge_id', challengeId)
        .order('created_at');

    // Get profile names
    const userIds = [...new Set((msgs || []).map(m => m.user_id))];
    let names = {};
    if (userIds.length > 0) {
        const { data: profs } = await sb
            .from('profiles')
            .select('id, display_name, handle')
            .in('id', userIds);
        (profs || []).forEach(p => { names[p.id] = p.display_name || (p.handle ? '@' + p.handle : p.id.slice(0, 8)); });
    }

    let html = '<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:1000;display:flex;align-items:center;justify-content:center;" onclick="if(event.target===this)this.remove()">';
    html += '<div style="background:white;border-radius:16px;padding:20px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><h3 style="margin:0;">Chat History</h3><button onclick="this.closest(\'div[style*=fixed]\').remove()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;">✕</button></div>';

    if (!msgs || msgs.length === 0) {
        html += '<p style="color:#9ca3af;text-align:center;">No messages</p>';
    } else {
        msgs.forEach(m => {
            const name = names[m.user_id] || m.user_id.slice(0, 8);
            const time = new Date(m.created_at).toLocaleString();
            html += `<div style="margin-bottom:10px;padding:8px 12px;background:#f9fafb;border-radius:10px;">`;
            html += `<div style="font-size:12px;color:#6b7280;margin-bottom:2px;"><strong>${name}</strong> · ${time}</div>`;
            html += `<div style="font-size:14px;">${m.text}</div>`;
            html += `</div>`;
        });
    }

    html += '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
}

loadQueue();
</script>
</body>
</html>
